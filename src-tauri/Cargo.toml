[workspace]
members = ["crates/core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[package]
name = "aeroworship"
description = "Offline-first church presentation software for Windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aeroworship-core = { path = "crates/core" }
tauri = { version = "2", default-features = false, features = [
  "wry",
  "compression",
  "common-controls-v6",
  "x11",
  "dbus",
] }
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"

[dev-dependencies]
tauri = { version = "2", default-features = false, features = ["test"] }

[profile.release]
debug-assertions = false
opt-level = "s"
lto = true
codegen-units = 1
panic = "unwind"
strip = true
